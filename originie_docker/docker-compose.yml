
services:
  mysql:
    image: mysql:8.0
    container_name: originie-mysql-dev
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: originie
      MYSQL_USER: originie_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - originie_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile

    container_name: originie-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: originie_app
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: originie
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}

    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  originie_mysql_data:
