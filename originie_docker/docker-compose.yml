
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: originie-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_started

    networks:
      - originie_edge

  mysql:
    image: mysql:8.0
    container_name: originie-mysql-dev
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: originie
      MYSQL_USER: originie_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - originie_mysql_data:/var/lib/mysql

    networks:
      - originie_internal

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile

    container_name: originie-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: originie_app
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: originie
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - originie_edge
      - originie_internal

volumes:
  originie_mysql_data:

networks:
  originie_edge:
    driver: bridge

  originie_internal:
    driver: bridge
    internal: true
